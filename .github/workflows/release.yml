name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  web:
    name: Verify and bundle plugin pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"
      - name: Install and verify pages
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run verify
      - uses: actions/upload-artifact@v4
        with:
          name: usage-statistics-web
          path: web/dist/index.html
          if-no-files-found: error

  build:
    name: Build ${{ matrix.goos }} ${{ matrix.goarch }}
    needs: web
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
          - goos: linux
            goarch: arm64
            runner: ubuntu-24.04-arm
          - goos: darwin
            goarch: amd64
            runner: macos-15-intel
          - goos: darwin
            goarch: arm64
            runner: macos-latest
          - goos: windows
            goarch: amd64
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: "1"
      PLUGIN_REPOSITORY: https://github.com/Fwindy/cpa-usage-statistics
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: usage-statistics-web
          path: web/dist

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - name: Install Windows C compiler
        if: matrix.goos == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            zip

      - name: Add MSYS2 to PATH
        if: matrix.goos == 'windows'
        shell: pwsh
        run: echo "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Resolve version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: echo "PLUGIN_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Test
        run: go test ./...

      - name: Package
        shell: bash
        run: bash ./package-release.sh dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cpa-plugin-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.zip
            dist/checksums.txt

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cpa-plugin-*
          path: artifacts

      - name: Merge checksums
        run: |
          find artifacts -name '*.zip' -exec cp {} . \;
          find artifacts -name checksums.txt -print0 | xargs -0 cat > checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            *.zip
            checksums.txt
